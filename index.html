<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabrina Khoirunnisa - Data Analyst</title>
    <!-- Import Font -->
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Import FontAwesome untuk ikon email -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #e5d9d3; 
            display: flex;
            justify-content: center;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: #f9f6f0; 
            min-height: 100vh;
            position: relative;
            padding-bottom: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            overflow-x: hidden;
        }

        /* Latar Belakang Atas */
        .header-bg {
            background-color: #5c3d31; 
            background-image: url('background word.jpeg'); 
            background-size: cover;
            background-position: center;
            height: 220px;
            width: 100%;
        }

        /* Area Profil */
        .profile-section {
            text-align: center;
            margin-top: -55px; 
            position: relative;
            z-index: 2;
        }

        .profile-img {
            width: 115px;
            height: 115px;
            border-radius: 50%;
            background-color: #ccc;
            background-image: url('Sabrina.jpeg'); 
            background-size: cover;
            background-position: center;
            border: 4px solid #f9f6f0; 
            margin: 0 auto;
            animation: floatSmooth 4s ease-in-out infinite;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Nama dengan Efek Shading/Kilauan */
        .name {
            font-family: 'Alex Brush', cursive; 
            font-size: 2.8rem;
            font-weight: normal;
            margin-top: 15px;
            letter-spacing: 1px;
            
            /* Konfigurasi Shading Gradasi */
            background: linear-gradient(
                120deg,
                #222 30%,
                #c8a996 50%, /* Warna kilauan shading (Cokelat muda / emas) */
                #222 70%
            );
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;

            /* Animasi: Muncul membal, lalu kilauan berjalan terus */
            opacity: 0;
            animation: popBounce 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, shineShading 4s linear infinite 1s;
        }

        .subtitle {
            font-size: 0.75rem;
            letter-spacing: 3px;
            margin-top: 5px;
            margin-bottom: 35px;
            font-weight: 400;
            color: #444;
            opacity: 0;
            animation: fadeUp 1s ease-out 0.3s forwards;
        }

        /* Tombol Link */
        .links-container {
            padding: 0 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            z-index: 2;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            text-decoration: none;
            color: #222;
            background-color: transparent;
            border: 1px solid #222;
            border-radius: 30px; 
            padding: 15px;
            text-align: center;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            font-weight: 400;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); 
            opacity: 0;
            animation: fadeUpBounce 0.8s forwards;
        }

        .link-btn:nth-child(1) { animation-delay: 0.4s; }
        .link-btn:nth-child(2) { animation-delay: 0.5s; }
        .link-btn:nth-child(3) { animation-delay: 0.6s; }
        .link-btn:nth-child(4) { animation-delay: 0.7s; }
        .link-btn:nth-child(5) { animation-delay: 0.8s; }

        .link-btn::after {
            content: '✨';
            position: absolute;
            right: 20px;
            opacity: 0;
            transform: scale(0) rotate(-45deg);
            transition: all 0.4s ease;
        }

        .link-btn:hover {
            background-color: #5c3d31; 
            color: #fff;
            border-color: #5c3d31;
            transform: scale(1.05) translateY(-3px); 
            box-shadow: 0 10px 20px rgba(92, 61, 49, 0.2);
            font-weight: 500;
        }

        .link-btn:hover::after {
            opacity: 1;
            transform: scale(1.2) rotate(0deg);
        }

        /* Informasi Email di Bawah */
        .footer-contact {
            margin-top: 45px;
            text-align: center;
            font-size: 0.85rem;
            color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            opacity: 0;
            animation: fadeUp 1s ease-out 1s forwards;
        }

        .footer-contact i {
            font-size: 1.1rem;
            animation: wiggle 2.5s infinite;
            transform-origin: bottom center;
        }

        /* --- KUMPULAN ANIMASI (KEYFRAMES) --- */

        /* Animasi Kilauan Shading pada Teks */
        @keyframes shineShading {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        @keyframes floatSmooth {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes popBounce {
            0% { opacity: 0; transform: scale(0.8) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes fadeUpBounce {
            0% { opacity: 0; transform: translateY(30px); }
            60% { opacity: 1; transform: translateY(-5px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes wiggle {
            0%, 80%, 100% { transform: rotate(0deg); }
            85% { transform: rotate(-12deg); }
            90% { transform: rotate(12deg); }
            95% { transform: rotate(-6deg); }
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- Latar Atas Cokelat -->
        <div class="header-bg"></div>

        <!-- Profil, Nama, Gelar -->
        <div class="profile-section">
            <div class="profile-img"></div>
            <h1 class="name">Sabrina Khoirunnisa</h1>
            <p class="subtitle">DATA ANALYST</p>
        </div>

        <!-- Tombol Menu -->
        <div class="links-container">
            <a href="#" class="link-btn">ABOUT ME</a>
            <a href="#" class="link-btn">MY EXPERIENCE</a>
            <a href="#" class="link-btn">PORTFOLIO</a>
            <a href="#" class="link-btn">MY HOBBY</a>
            <a href="#" class="link-btn">CONTACT ME</a>
        </div>

        <!-- Kontak Email -->
        <div class="footer-contact">
            <i class="fa-regular fa-envelope"></i>
            <span>sabrinanisakhoirunnisa@gmail.com</span>
        </div>
    </div>

</body>
</html>
